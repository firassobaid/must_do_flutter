<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.18" r="1.0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9A8D4"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#glow)"/>

  <!-- soft drop shadows -->
  <path d="M282 570 L442 720 L706 410" fill="none" stroke="#312E81" stroke-opacity="0.35"
        stroke-width="118" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="790" cy="304" r="62" fill="#312E81" fill-opacity="0.35" transform="translate(0,14)"/>

  <!-- checkmark -->
  <path d="M282 556 L442 706 L706 396" fill="none" stroke="#FFFFFF"
        stroke-width="118" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- pink spark dot: continues the check's sweep, reads as the "!" in Must -->
  <circle cx="790" cy="304" r="62" fill="url(#dot)"/>
</svg>
